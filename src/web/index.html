<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>FinTrack — Dompet Saya</title>
    <meta name="description" content="Catat pengeluaran dan lacak portofolio: saham IDX, crypto, reksadana." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0e9f6e" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="stylesheet" href="/styles.css" />
    <script>
      try {
        if (localStorage.getItem('fintrack-theme') === 'dark') document.documentElement.dataset.theme = 'dark';
      } catch (e) { /* ignore */ }
    </script>
  </head>
  <body>
    <div id="shell">
      <aside id="sidebar" aria-label="Navigasi utama"></aside>
      <div id="main">
        <header id="topbar"></header>
        <div id="pagehead"></div>
        <main id="app" tabindex="-1"></main>
      </div>
      <nav id="bottomnav" aria-label="Navigasi utama"></nav>
    </div>
    <div id="modal-root"></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
